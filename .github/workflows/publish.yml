name: Build and publish static demo site

on:
  # Run on pushes to any branch (except the generated gh-pages branch) so CI checks run before merge
  push:
    # Run on all branches except the generated gh-pages branch
    branches-ignore:
      - 'gh-pages'
    # Ignore generated artifacts to avoid workflow retrigger loops
    paths-ignore:
      - 'docs/**'
      - 'rf_stress_model.joblib'
  # Also run the workflow on pull requests targeting main so you can see results before merging
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'rf_stress_model.joblib'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    concurrency:
      # Use a per-branch concurrency group so runs for different branches do not cancel each other
      group: publish-docs-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install CI requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_ci.txt

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: set-image
        run: |
          # create lowercase image name (GHCR requires lowercase names)
          repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          image_latest="ghcr.io/${repo_lower}/mindguard:latest"
          image_sha="ghcr.io/${repo_lower}/mindguard:${GITHUB_SHA}"
          echo "image_latest=$image_latest" >> $GITHUB_OUTPUT
          echo "image_sha=$image_sha" >> $GITHUB_OUTPUT

      - name: Build and push Docker image (runs app.py)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.set-image.outputs.image_latest }},${{ steps.set-image.outputs.image_sha }}
